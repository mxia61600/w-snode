<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>自然环境展示</title>

<style>
    body, html {
        margin: 0;
        padding: 0;
        height: 100%;
        font-family: Arial, sans-serif;
        background: #000;
    }

    /* 整个页面为全屏照片 */
    .background-photo {
        width: 100%;
        height: 100vh;
        background-image: url("https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=1600&q=80");
        background-size: cover;        /* 自适应裁剪，不变形 */
        background-position: center;   /* 居中显示 */
        background-repeat: no-repeat;
    }

    /* 标题文字 */
    .title {
        position: absolute;
        top: 5%;
        left: 5%;
        padding: 10px 20px;
        background: rgba(0,0,0,0.4);
        color: #fff;
        font-size: 26px;
        border-radius: 6px;
    }
</style>
</head>

<body>
    <div class="background-photo"></div>
    <div class="title">自然环境</div>
</body>
</html>
